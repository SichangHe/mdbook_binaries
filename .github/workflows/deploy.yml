name: CI
on:
  push:
  schedule:
  - cron: '0 0 * * 1'

permissions:
  contents: write

concurrency:
  group: binaries
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: configure git
      run: |
        git config --global user.name "SichangHe"
        git config --global user.email "sichanghe@users.noreply.github.com"
    - uses: swatinem/rust-cache@v2
    - name: Install mdbook
      run: |
        cargo install mdbook --version 0.5.4
        which mdbook
    - name: Install mdbook-katex
      run: |
        cargo install --git https://github.com/SichangHe/mdbook-katex.git --rev f623f031d705ec96e5f747b8c3a910ef1a32734b --locked
        which mdbook-katex
    - name: push
      run: |
        rm -rf bin
        mkdir bin
        mv ~/.cargo/bin/mdbook bin
        mv ~/.cargo/bin/mdbook-katex bin
        git add bin
        git commit --allow-empty -m "build $GITHUB_SHA"
        git push
